name: ms-catalog

on:
  push:
    branches: [main]
    paths:
      - "ms-catalog/**"
      - "infra/mongo/**"
      - ".github/workflows/ms-catalog.yml"
      - ".github/workflows/_java.yml"
  pull_request:
    paths:
      - "ms-catalog/**"
      - "infra/mongo/**"
      - ".github/workflows/ms-catalog.yml"
      - ".github/workflows/_java.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # En un PR, un push nuevo cancela la ejecución vieja (mismo grupo). En main cada ejecución tiene su propio grupo y
  # corre completa: una ejecución cancelada o descartada en main deja el badge del README en «failing» (2026-11-13).
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  pruebas:
    uses: ./.github/workflows/_java.yml
    with:
      servicio: ms-catalog
