name: frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # En un PR, un push nuevo cancela la ejecución vieja (mismo grupo). En main cada ejecución tiene su propio grupo y
  # corre completa: una ejecución cancelada o descartada en main deja el badge del README en «failing» (2026-11-13).
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: build y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      # La misma versión mayor que la imagen de compilación (frontend/Dockerfile: node:24-alpine).
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Análisis estático (ESLint)
        run: npm run lint

      - name: Verificar tipos y compilar (tsc -b + vite build)
        run: npm run build

      - name: Pruebas (Vitest)
        run: npm test
