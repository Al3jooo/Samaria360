server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    # .env de la raíz del monorepo (el gateway se ejecuta desde su propia carpeta)
    import: optional:file:../.env[.properties]
  cloud:
    # Sin el bulkhead por defecto de Spring Cloud CircuitBreaker (semáforo de 25 llamadas simultáneas por ruta, sin
    # espera): en la prueba de carga de RNF03 un tropiezo de ~1 s lo llenaba, sus rechazos abrían el circuito y la ruta
    # respondía 503 durante 10 s (DEC-277). El gateway es reactivo (no hay hilos que aislar); a cada ruta la acotan el
    # timeout de respuesta y su circuit breaker. Lo prueba ConcurrenciaRutasTest.
    circuitbreaker:
      bulkhead:
        resilience4j:
          enabled: false
    gateway:
      server:
        webflux:
          # Desde Spring Cloud Gateway 4.1 las cabeceras X-Forwarded-* solo se conservan y se agregan si quien llama es
          # un proxy de confianza; sin esto el gateway las quitaba y ms-catalog no contaba ninguna consulta a las fichas
          # (DEC-307: cuenta solo lo que llega con X-Forwarded-For, RF14 y RF31). De confianza: nginx y el host, es
          # decir, las direcciones privadas y de loopback de la red de Docker (DEC-314). Se ajusta con
          # GATEWAY_PROXIES_CONFIABLES.
          trusted-proxies: ${GATEWAY_PROXIES_CONFIABLES:10\..*|172\.(1[6-9]|2[0-9]|3[01])\..*|192\.168\..*|127\..*|0:0:0:0:0:0:0:1|::1}
          httpclient:
            connect-timeout: 2000 # ms
            response-timeout: 5s
          # El gateway no valida el JWT: reenvía Authorization sin cambios y cada servicio lo valida con el JWKS de
          # ms-auth (ADR-005). No se reescriben las rutas: /api/v1/... llega igual al servicio.
          routes:
            - id: auth
              uri: ${AUTH_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: auth
                    fallbackUri: forward:/fallback/auth
                    # Solo la indisponibilidad abre el circuito; un 4xx o un 500 de negocio pasan tal cual.
                    statusCodes: [502, 503, 504]
            - id: catalogo
              uri: ${CATALOG_URI:http://localhost:8082}
              predicates:
                - Path=/api/v1/catalogo/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: catalogo
                    fallbackUri: forward:/fallback/catalogo
                    statusCodes: [502, 503, 504]
            - id: reservas
              uri: ${BOOKING_URI:http://localhost:8083}
              predicates:
                - Path=/api/v1/reservas/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: reservas
                    fallbackUri: forward:/fallback/reservas
                    # Sin 503: ms-booking responde 503 SERVICIO_NO_DISPONIBLE (servicio: ms-catalog) cuando el catálogo
                    # no responde, y debe llegar tal cual. Si ms-booking no responde (conexión rechazada o tiempo
                    # agotado), sí va al fallback (servicio: ms-booking).
                    statusCodes: [502, 504]
            # ms-analytics (plan del 100 %, DEC-292): auditoría, notificaciones y, después, calificaciones y tableros.
            - id: analitica
              uri: ${ANALYTICS_URI:http://localhost:8084}
              predicates:
                - Path=/api/v1/analytics/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: analitica
                    fallbackUri: forward:/fallback/analitica
                    statusCodes: [502, 503, 504]
            # ms-chatbot (plan del 100 %, DEC-297): asistente virtual, itinerarios y base de conocimientos.
            - id: asistente
              uri: ${CHATBOT_URI:http://localhost:8085}
              predicates:
                - Path=/api/v1/chatbot/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: asistente
                    fallbackUri: forward:/fallback/asistente
                    statusCodes: [502, 503, 504]
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: ${CORS_ORIGENES:http://localhost:5173} # separados por comas
                allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
                # Idempotency-Key e Idempotent-Replayed: reservar es idempotente por clave (ms-booking, D6).
                allowed-headers: [Authorization, Content-Type, X-Correlation-Id, Idempotency-Key]
                exposed-headers: [X-Correlation-Id, Idempotent-Replayed, Location, Retry-After]
                allow-credentials: false # el token va en la cabecera Authorization, no en cookies
                max-age: 3600

# Límite de tasa del login y del registro por dirección del cliente (DEC-271, mitigación de ADR-006). Al pasarlo, 429
# DEMASIADAS_SOLICITUDES con Retry-After. El bloqueo de RF15 (3 intentos por cuenta) sigue en ms-auth.
samaria360:
  limite-tasa:
    login:
      maximo: 10
      ventana: 1m
    registro:
      maximo: 5
      ventana: 10m
    # RF34 (DEC-285): pedir el enlace de recuperación y restablecer, con el mismo cupo que el registro.
    recuperacion:
      maximo: 5
      ventana: 10m

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
