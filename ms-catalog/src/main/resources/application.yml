server:
  port: 8082
  tomcat:
    # Por encima de max-request-size: Tomcat lee y descarta el resto de una carga rechazada, así el cliente recibe el
    # 413 en vez de una conexión cortada (ADR-009).
    max-swallow-size: 32MB

spring:
  application:
    name: ms-catalog
  config:
    # .env de la raíz del monorepo (ms-catalog se ejecuta desde su propia carpeta)
    import: optional:file:../.env[.properties]
  # Sin perfil por defecto: el perfil dev (Swagger) se activa solo de forma explícita,
  # con SPRING_PROFILES_ACTIVE=dev (Docker Compose) o -Dspring-boot.run.profiles=dev (./mvnw). Mismo criterio que ms-auth,
  # donde dev además carga la semilla.
  servlet:
    multipart:
      # Registro de atractivos (RF06, DEC-209, ADR-009): de 1 a 5 imágenes de 5 MB más los datos. El tope por parte
      # queda por encima de 5 MB para que una imagen de más llegue al dominio y reciba su motivo por campo
      # (TAMANO_MAXIMO); lo que supere estos topes es un 413 CARGA_DEMASIADO_GRANDE.
      max-file-size: 6MB
      max-request-size: 30MB
  data:
    mongodb:
      # Usuario propio con readWrite solo en catalog_db (DEC-275), creado en la base admin por mongo-migraciones:
      # authSource=admin. Sin CATALOG_DB_USER en .env (arranque local antiguo), el usuario raíz.
      # Si la contraseña tiene caracteres especiales (@ : / ? # %), debe ir codificada para URL en .env.
      # MONGO_HOST: localhost con ./mvnw; "mongo" dentro de Docker Compose.
      uri: mongodb://${CATALOG_DB_USER:${MONGO_USER}}:${CATALOG_DB_PASSWORD:${MONGO_PASSWORD}}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/catalog_db?authSource=admin${MONGO_OPCIONES:&directConnection=true}
      # Explícito: en pruebas, la conexión de Testcontainers apunta a otra base por defecto.
      database: catalog_db
  # Eventos del catálogo en RabbitMQ (ADR-011, DEC-293): usuario propio, que escribe en el exchange y lee su cola.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ms-catalog
    password: ${RABBITMQ_CATALOG_PASSWORD:}
    virtual-host: samaria360
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    connection-timeout: 2s
    # Consume ms-catalog.eventos.v1 (PromedioActualizado, DEC-302): idempotente por versión; un mensaje inválido va a la
    # .dlq sin reintentos (ADR-011). Si la cola no existe todavía, el servicio arranca igual.
    listener:
      simple:
        concurrency: 1
        max-concurrency: 1
        default-requeue-rejected: false
        missing-queues-fatal: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 5

samaria360:
  seguridad:
    # JWKS de ms-auth para validar los JWT de los endpoints protegidos (la búsqueda es pública).
    jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/api/v1/auth/.well-known/jwks.json}
    emisor: samaria360-auth
    # aud de los tokens de servicio que ms-auth usa en /internal/** (ADR-008)
    audiencia: ms-catalog
  # Relevo del outbox hacia RabbitMQ (ADR-011). Si RabbitMQ no está, los eventos esperan en outbox_eventos.
  eventos:
    habilitado: true
    cada: PT1S

# Solo /actuator/health (healthcheck de Docker Compose), igual que ms-booking y api-gateway.
management:
  endpoints:
    web:
      exposure:
        include: health
  # RabbitMQ no cuenta para la salud: si falta, los eventos esperan en el outbox (ADR-011).
  health:
    rabbit:
      enabled: false

# Swagger solo en dev (ver documento de perfil dev más abajo)
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: dev
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
