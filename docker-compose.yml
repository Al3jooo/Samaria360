# Samaria360 - Prototipo arquitectónico ejecutable (fase de Construcción, RUP)
# Sistema completo en un comando:  docker compose up -d --build   →  http://localhost:${FRONTEND_PORT:-8000}
#
# Entrada: el navegador habla solo con frontend (nginx), que pasa /api/ a api-gateway (ADR-005). En el host se
# publican el frontend y el gateway; ms-auth, ms-catalog y ms-booking solo se alcanzan dentro de la red de Docker;
# PostgreSQL, MongoDB y la consola de RabbitMQ solo en 127.0.0.1 (DBeaver, Compass). RabbitMQ es el nivel 3 de ADR-003
# (ADR-011); Mailpit, el servidor SMTP de desarrollo, solo con el perfil dev (COMPOSE_PROFILES=dev en .env, DEC-282).
#
# Requisitos: .env (copia de .env.example) y las llaves del JWT en infra/keys/ (ver README.md, «Arranque en un comando»).

x-reinicio: &reinicio
  restart: unless-stopped

# Salud de los servicios Java: /actuator/health (público en los tres).
# Límite de memoria de cada JVM. Las imágenes usan -XX:MaxRAMPercentage=75: sin este límite, cada JVM calcula su
# memoria sobre toda la máquina virtual de Docker. Con 768m, el heap máximo queda en ~576 MB y el resto (metaspace,
# hilos, búferes) cabe en el contenedor.
x-memoria-java: &memoria-java
  mem_limit: 768m

x-salud-java: &salud-java
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 60s

services:
  postgres:
    image: postgres:16-alpine
    container_name: samaria360-postgres
    <<: *reinicio
    # Memoria (README, «Memoria»): en reposo usa ~60-150 MB.
    mem_limit: 256m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Crea auth_db y reservas_db en el primer arranque (volumen vacío)
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Un solo uso: en cada arranque crea las bases que falten, también en volúmenes creados antes de que existieran
  # (init/ solo corre con el volumen vacío). Es idempotente y termina; ms-auth espera a que termine bien.
  postgres-bases:
    image: postgres:16-alpine
    container_name: samaria360-postgres-bases
    restart: "no"
    environment:
      PGHOST: postgres
      PGDATABASE: postgres
      PGUSER: ${POSTGRES_USER:?Falta POSTGRES_USER en .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      # Usuarios propios de ms-auth y ms-booking (DEC-275): este servicio los crea o actualiza en cada arranque.
      AUTH_DB_USER: ${AUTH_DB_USER:-auth_app}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?Falta AUTH_DB_PASSWORD en .env}
      BOOKING_DB_USER: ${BOOKING_DB_USER:-booking_app}
      BOOKING_DB_PASSWORD: ${BOOKING_DB_PASSWORD:?Falta BOOKING_DB_PASSWORD en .env}
    volumes:
      - ./infra/postgres/asegurar-bases.sql:/sql/asegurar-bases.sql:ro
      - ./infra/postgres/reasignar-objetos.sql:/sql/reasignar-objetos.sql:ro
    # Las contraseñas llegan como variables de psql (-v), nunca en el texto del script.
    command:
      - sh
      - -c
      - >-
        psql -v ON_ERROR_STOP=1
        -v auth_usuario="$$AUTH_DB_USER" -v auth_clave="$$AUTH_DB_PASSWORD"
        -v booking_usuario="$$BOOKING_DB_USER" -v booking_clave="$$BOOKING_DB_PASSWORD"
        -f /sql/asegurar-bases.sql
    depends_on:
      postgres:
        condition: service_healthy

  mongo:
    image: mongo:7.0
    container_name: samaria360-mongo
    <<: *reinicio
    # Sin límite, la caché de WiredTiger toma ~50 % de (RAM de la máquina virtual de Docker − 1 GB). Con 0,25 GB de
    # caché y 512 MB de límite, todo el sistema cabe en ~4 GB (README, «Memoria»).
    # Réplica rs0 de un solo nodo (DEC-281) para las transacciones del outbox (ADR-011); la inicia mongo-migraciones.
    # Con control de acceso, la réplica exige un keyFile: se genera la primera vez en su propio volumen (nunca en Git).
    command:
      - sh
      - -c
      - >-
        if [ ! -s /data/llave/mongo.key ]; then openssl rand -base64 756 > /data/llave/mongo.key; fi &&
        chmod 400 /data/llave/mongo.key && chown 999:999 /data/llave/mongo.key &&
        exec docker-entrypoint.sh mongod --wiredTigerCacheSizeGB 0.25 --replSet rs0 --keyFile /data/llave/mongo.key
    mem_limit: 512m
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?Falta MONGO_USER en .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Falta MONGO_PASSWORD en .env}
      MONGO_INITDB_DATABASE: catalog_db
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
      - mongo-llave:/data/llave
      # Línea base congelada (formato v1): validadores, índices (2dsphere) y semilla. Solo con el volumen vacío.
      - ./infra/mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Un solo uso: aplica las migraciones de catalog_db (infra/mongo/migraciones) que falten, igual en un volumen nuevo
  # que en uno existente, y termina. ms-catalog espera a que termine bien.
  mongo-migraciones:
    image: mongo:7.0
    container_name: samaria360-mongo-migraciones
    restart: "no"
    environment:
      MONGO_USER: ${MONGO_USER:?Falta MONGO_USER en .env}
      MONGO_PASSWORD: ${MONGO_PASSWORD:?Falta MONGO_PASSWORD en .env}
      # Configuración de DEMOSTRACIÓN: aplica también infra/mongo/migraciones/semilla. Para un despliegue real, false.
      MONGO_SEMILLA: "true"
      # Usuario propio de ms-catalog (DEC-275): readWrite solo en catalog_db; lo crea o actualiza este servicio.
      CATALOG_DB_USER: ${CATALOG_DB_USER:-catalog_app}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?Falta CATALOG_DB_PASSWORD en .env}
      # Usuario propio de ms-analytics: readWrite solo en analytics_db (como DEC-275).
      ANALYTICS_DB_USER: ${ANALYTICS_DB_USER:-analytics_app}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:?Falta ANALYTICS_DB_PASSWORD en .env}
      # Usuario propio de ms-chatbot: readWrite solo en chatbot_db (como DEC-275).
      CHATBOT_DB_USER: ${CHATBOT_DB_USER:-chatbot_app}
      CHATBOT_DB_PASSWORD: ${CHATBOT_DB_PASSWORD:?Falta CHATBOT_DB_PASSWORD en .env}
    volumes:
      - ./infra/mongo/migraciones:/migraciones:ro
      - ./infra/mongo/analytics:/analytics:ro
      - ./infra/mongo/chatbot:/chatbot:ro
    entrypoint: ["sh", "/migraciones/aplicar.sh"]
    depends_on:
      mongo:
        condition: service_healthy

  # Nivel 3 de ADR-003 (ADR-011, DEC-284): topología en infra/rabbitmq/definiciones.json y un usuario por servicio con
  # permisos mínimos, creados en cada arranque por iniciar.sh con las contraseñas de .env.
  rabbitmq:
    image: rabbitmq:4.1.4-management-alpine
    container_name: samaria360-rabbitmq
    <<: *reinicio
    mem_limit: 384m
    hostname: rabbitmq
    entrypoint: ["sh", "/etc/rabbitmq/iniciar.sh"]
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER:?Falta RABBITMQ_USER en .env}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Falta RABBITMQ_PASSWORD en .env}
      RABBITMQ_AUTH_PASSWORD: ${RABBITMQ_AUTH_PASSWORD:?Falta RABBITMQ_AUTH_PASSWORD en .env}
      RABBITMQ_BOOKING_PASSWORD: ${RABBITMQ_BOOKING_PASSWORD:?Falta RABBITMQ_BOOKING_PASSWORD en .env}
      RABBITMQ_CATALOG_PASSWORD: ${RABBITMQ_CATALOG_PASSWORD:?Falta RABBITMQ_CATALOG_PASSWORD en .env}
      RABBITMQ_ANALYTICS_PASSWORD: ${RABBITMQ_ANALYTICS_PASSWORD:?Falta RABBITMQ_ANALYTICS_PASSWORD en .env}
      RABBITMQ_CHATBOT_PASSWORD: ${RABBITMQ_CHATBOT_PASSWORD:?Falta RABBITMQ_CHATBOT_PASSWORD en .env}
    ports:
      # Consola de administración, solo en 127.0.0.1 (ADR-011, punto 9); AMQP (5672) solo en la red interna y en
      # 127.0.0.1 para el arranque local con ./mvnw.
      - "127.0.0.1:${RABBITMQ_CONSOLA_PORT:-15672}:15672"
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./infra/rabbitmq/definiciones.json:/etc/rabbitmq/definiciones.json:ro
      - ./infra/rabbitmq/iniciar.sh:/etc/rabbitmq/iniciar.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/rabbitmq-listo && rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # Servidor SMTP de desarrollo y CI (DEC-282): reemplaza al «Servidor SMTP» externo del diagrama de despliegue; no es
  # un contenedor de la arquitectura. Bandeja web en http://localhost:8025. En la demo, SMTP de Gmail (SMTP_* en .env).
  mailpit:
    image: axllent/mailpit:v1.27.11
    container_name: samaria360-mailpit
    profiles: ["dev"]
    <<: *reinicio
    mem_limit: 64m
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    expose:
      - "1025"

  ms-auth:
    build: ./ms-auth
    image: samaria360/ms-auth:0.1.0
    container_name: samaria360-ms-auth
    <<: [*reinicio, *memoria-java]
    environment:
      # Configuración de DEMOSTRACIÓN: el perfil dev carga los usuarios de prueba (db/semilla) y Swagger.
      # Para un despliegue real, quitar esta línea.
      SPRING_PROFILES_ACTIVE: dev
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      # Usuario propio, dueño solo de auth_db (DEC-275); el superusuario no llega a este contenedor.
      AUTH_DB_USER: ${AUTH_DB_USER:-auth_app}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?Falta AUTH_DB_PASSWORD en .env}
      # Relevo de cuentas hacia los endpoints internos de ms-catalog y ms-booking (ADR-008): URI, no secretos.
      CATALOG_INTERNO_URI: http://ms-catalog:8082
      BOOKING_INTERNO_URI: http://ms-booking:8083
      # Publicación de eventos en RabbitMQ con el usuario propio de ms-auth (ADR-011).
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_AUTH_PASSWORD: ${RABBITMQ_AUTH_PASSWORD:?Falta RABBITMQ_AUTH_PASSWORD en .env}
      # Correo de la recuperación de contraseña (RF34, DEC-282): Mailpit con el perfil dev; SMTP de Gmail en la demo.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PUERTO: ${SMTP_PUERTO:-1025}
      SMTP_USUARIO: ${SMTP_USUARIO:-}
      SMTP_CLAVE: ${SMTP_CLAVE:-}
      SMTP_TLS: ${SMTP_TLS:-false}
      CORREO_REMITENTE: ${CORREO_REMITENTE:-no-responder@samaria360.local}
      # Secretos de los clientes internos (DEC-280): ms-analytics lee contactos de prestadores (RF30).
      SERVICIO_ANALYTICS_SECRETO: ${SERVICIO_ANALYTICS_SECRETO:?Falta SERVICIO_ANALYTICS_SECRETO en .env}
      SERVICIO_BOOKING_SECRETO: ${SERVICIO_BOOKING_SECRETO:-}
      # Origen del enlace del correo de RF34 (la SPA): en la demo, https://samaria360.duckdns.org.
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8000}
      JWT_LLAVE_PRIVADA: /run/secrets/jwt_llave_privada
      JWT_LLAVE_PUBLICA: /run/secrets/jwt_llave_publica
    # Llaves montadas como archivos de solo lectura en /run/secrets/; nunca se copian a la imagen.
    secrets:
      - jwt_llave_privada
      - jwt_llave_publica
    expose:
      - "8081" # sin ports: solo se alcanza por la red interna, a través del gateway (ADR-005)
    # RabbitMQ solo para el orden de arranque: si no está, los eventos esperan en el outbox (ADR-011).
    depends_on:
      postgres-bases:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8081/actuator/health"]
      <<: *salud-java

  ms-catalog:
    build: ./ms-catalog
    image: samaria360/ms-catalog:0.1.0
    container_name: samaria360-ms-catalog
    <<: [*reinicio, *memoria-java]
    environment:
      # Configuración de DEMOSTRACIÓN (perfil dev: Swagger; la semilla del catálogo la cargan los scripts de mongo).
      SPRING_PROFILES_ACTIVE: dev
      MONGO_HOST: mongo
      MONGO_PORT: "27017"
      # Réplica rs0 (DEC-281); con ./mvnw el valor por defecto es directConnection=true.
      MONGO_OPCIONES: "&replicaSet=rs0"
      # Usuario propio con readWrite solo en catalog_db (DEC-275); root no llega a este contenedor.
      CATALOG_DB_USER: ${CATALOG_DB_USER:-catalog_app}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?Falta CATALOG_DB_PASSWORD en .env}
      AUTH_JWKS_URI: http://ms-auth:8081/api/v1/auth/.well-known/jwks.json
      # Eventos del catálogo en RabbitMQ con el usuario propio de ms-catalog (ADR-011, DEC-293).
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_CATALOG_PASSWORD: ${RABBITMQ_CATALOG_PASSWORD:?Falta RABBITMQ_CATALOG_PASSWORD en .env}
    expose:
      - "8082"
    depends_on:
      mongo-migraciones:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8082/actuator/health"]
      <<: *salud-java

  ms-booking:
    build: ./ms-booking
    image: samaria360/ms-booking:0.1.0
    container_name: samaria360-ms-booking
    <<: [*reinicio, *memoria-java]
    # Servicio pequeño: con -XX:MaxRAMPercentage=75 el heap queda en ~384 MB (README, «Memoria»).
    mem_limit: 512m
    environment:
      # Configuración de DEMOSTRACIÓN (perfil dev: Swagger). Para un despliegue real, quitar esta línea.
      SPRING_PROFILES_ACTIVE: dev
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      # Usuario propio, dueño solo de reservas_db (DEC-275); el superusuario no llega a este contenedor.
      BOOKING_DB_USER: ${BOOKING_DB_USER:-booking_app}
      BOOKING_DB_PASSWORD: ${BOOKING_DB_PASSWORD:?Falta BOOKING_DB_PASSWORD en .env}
      AUTH_JWKS_URI: http://ms-auth:8081/api/v1/auth/.well-known/jwks.json
      # Llamada directa al endpoint público de detalle antes de reservar y para materializar la oferta del catálogo
      # en el inventario bajo demanda (ADR-007 y su enmienda A2; DEC-135)
      MS_CATALOG_URL: http://ms-catalog:8082
      # Eventos de reservas en RabbitMQ con el usuario propio de ms-booking (ADR-011, DEC-291).
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_BOOKING_PASSWORD: ${RABBITMQ_BOOKING_PASSWORD:?Falta RABBITMQ_BOOKING_PASSWORD en .env}
      # Contactos de los turistas para el listado de asistentes de RF42 (DEC-280, DEC-312), con su secreto de cliente.
      AUTH_INTERNO_URI: http://ms-auth:8081
      SERVICIO_BOOKING_SECRETO: ${SERVICIO_BOOKING_SECRETO:-}
    expose:
      - "8083"
    # Con el contenedor de ms-catalog detenido, su nombre no resuelve y el DNS de Docker tarda varios segundos en
    # responder que no existe. Con estas opciones la consulta falla en ~1 s y reservar responde 503 a tiempo
    # (ADR-007), antes de los 5 s del gateway.
    dns_opt:
      - "timeout:1"
      - "attempts:1"
    # ms-catalog solo para el orden de arranque: reservar y la disponibilidad funcionan aunque arranque después
    # (circuit breaker, ADR-007); lo que falte materializar se materializa en la primera consulta que lo necesite.
    depends_on:
      postgres-bases:
        condition: service_completed_successfully
      ms-catalog:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8083/actuator/health"]
      <<: *salud-java

  # Análisis y notificaciones (Entregable 2, figura 20; ADR-011, DEC-292): consume los eventos de RabbitMQ, guarda en
  # analytics_db y envía el correo de RF30 por SMTP.
  ms-analytics:
    build: ./ms-analytics
    image: samaria360/ms-analytics:0.1.0
    container_name: samaria360-ms-analytics
    <<: [*reinicio, *memoria-java]
    mem_limit: 512m
    environment:
      SPRING_PROFILES_ACTIVE: dev
      MONGO_HOST: mongo
      MONGO_PORT: "27017"
      MONGO_OPCIONES: "&replicaSet=rs0"
      ANALYTICS_DB_USER: ${ANALYTICS_DB_USER:-analytics_app}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:?Falta ANALYTICS_DB_PASSWORD en .env}
      AUTH_JWKS_URI: http://ms-auth:8081/api/v1/auth/.well-known/jwks.json
      # Contacto del Prestador para RF30 (endpoint interno de ms-auth con JWT de servicio, DEC-280).
      AUTH_INTERNO_URI: http://ms-auth:8081
      SERVICIO_ANALYTICS_SECRETO: ${SERVICIO_ANALYTICS_SECRETO:?Falta SERVICIO_ANALYTICS_SECRETO en .env}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_ANALYTICS_PASSWORD: ${RABBITMQ_ANALYTICS_PASSWORD:?Falta RABBITMQ_ANALYTICS_PASSWORD en .env}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PUERTO: ${SMTP_PUERTO:-1025}
      SMTP_USUARIO: ${SMTP_USUARIO:-}
      SMTP_CLAVE: ${SMTP_CLAVE:-}
      SMTP_TLS: ${SMTP_TLS:-false}
      CORREO_REMITENTE: ${CORREO_REMITENTE:-no-responder@samaria360.local}
    expose:
      - "8084"
    depends_on:
      mongo-migraciones:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8084/actuator/health"]
      <<: *salud-java

  # Asistente virtual (Entregable 2, figura 20; DEC-279, DEC-297): chatbot_db, la búsqueda pública del catálogo
  # (DEC-280) y el proveedor LLM externo (Gemini, solo con GEMINI_API_KEY; por defecto, reglas).
  ms-chatbot:
    build: ./ms-chatbot
    image: samaria360/ms-chatbot:0.1.0
    container_name: samaria360-ms-chatbot
    <<: [*reinicio, *memoria-java]
    mem_limit: 512m
    environment:
      SPRING_PROFILES_ACTIVE: dev
      MONGO_HOST: mongo
      MONGO_PORT: "27017"
      MONGO_OPCIONES: "&replicaSet=rs0"
      CHATBOT_DB_USER: ${CHATBOT_DB_USER:-chatbot_app}
      CHATBOT_DB_PASSWORD: ${CHATBOT_DB_PASSWORD:?Falta CHATBOT_DB_PASSWORD en .env}
      AUTH_JWKS_URI: http://ms-auth:8081/api/v1/auth/.well-known/jwks.json
      CATALOG_INTERNO_URI: http://ms-catalog:8082
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_CHATBOT_PASSWORD: ${RABBITMQ_CHATBOT_PASSWORD:?Falta RABBITMQ_CHATBOT_PASSWORD en .env}
      LLM_PROVEEDOR: ${LLM_PROVEEDOR:-reglas}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODELO: ${GEMINI_MODELO:-gemini-3.5-flash-lite}
    expose:
      - "8085"
    depends_on:
      mongo-migraciones:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8085/actuator/health"]
      <<: *salud-java

  api-gateway:
    build: ./api-gateway
    image: samaria360/api-gateway:0.1.0
    container_name: samaria360-api-gateway
    <<: [*reinicio, *memoria-java]
    environment:
      SPRING_PROFILES_ACTIVE: dev # configuración de demostración, igual que los servicios
      AUTH_URI: http://ms-auth:8081
      CATALOG_URI: http://ms-catalog:8082
      BOOKING_URI: http://ms-booking:8083
      ANALYTICS_URI: http://ms-analytics:8084
      CHATBOT_URI: http://ms-chatbot:8085
      # Con nginx el navegador usa un solo origen; CORS queda para el frontend en desarrollo (Vite).
      CORS_ORIGENES: http://localhost:${FRONTEND_PORT:-8000},http://localhost:5173
    # Solo en 127.0.0.1, como las bases: el navegador entra por el frontend (nginx); el 8080 queda para depurar y
    # para Vite en desarrollo, que lo alcanza en localhost.
    ports:
      - "127.0.0.1:8080:8080"
    # Solo espera a que arranquen, no a que estén sanos: el gateway debe funcionar aunque un servicio esté caído
    # (circuit breaker y fallback 503, ADR-005).
    depends_on:
      ms-auth:
        condition: service_started
      ms-catalog:
        condition: service_started
      ms-booking:
        condition: service_started
      ms-analytics:
        condition: service_started
      ms-chatbot:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/actuator/health"]
      <<: *salud-java

  frontend:
    build: ./frontend
    image: samaria360/frontend:0.1.0
    container_name: samaria360-frontend
    <<: *reinicio
    ports:
      # Solo en 127.0.0.1, como el gateway y las bases (DEC-266): el perfil dev y los usuarios de prueba no quedan
      # expuestos a la red local. nginx sin root escucha en 8080 dentro del contenedor (frontend/Dockerfile).
      - "127.0.0.1:${FRONTEND_PORT:-8000}:8080"
    # Espera al gateway sano: así el primer /api/ no encuentra el puerto cerrado. Si aun así nginx no logra hablar
    # con él (p. ej. tras reiniciar Docker, donde restart no respeta depends_on), responde un 503 con el ProblemDetail
    # SERVICIO_NO_DISPONIBLE (frontend/nginx/default.conf).
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

secrets:
  jwt_llave_privada:
    file: ./infra/keys/jwt-privada.pem
  jwt_llave_publica:
    file: ./infra/keys/jwt-publica.pem

volumes:
  postgres-data:
  mongo-data:
  mongo-llave:
  rabbitmq-data:
