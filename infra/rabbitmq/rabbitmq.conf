# Samaria360 - configuración de RabbitMQ (ADR-011, DEC-284).
# Topología (vhost, exchanges, colas y enlaces) importada al arrancar; sin usuarios: los crea iniciar.sh desde .env.
load_definitions = /etc/rabbitmq/definiciones.json
# Un solo nodo con poca memoria (docker-compose.yml, mem_limit): deja de aceptar publicaciones al 60 % del límite.
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 256MB
